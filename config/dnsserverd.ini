[LOGGING]
# File to write logs to. If not specified, log messages will be written to STDOUT/STDERR
log_file=/var/log/dnsserverd/dnsserverd.log
# Set the log level. Use '-1' for debug, '0' for info, '1' for error
log_level=-1

[SERVER]
interface=wlo1
laddr=192.168.0.1
lport=53
use_tcp=false

[DNS]
primary_upstream=1.1.1.1
backup_upstream=1.0.0.1
zone_records_filepath=/etc/dnsserverd/config/dns.zone

[EXPLOITATION]
redirect_dns_traffic=true
dns_redirect_target_ip=192.168.0.1
block_quic=true
block_doh=true
doh_hosts_filepath=/etc/dnsserverd/config/doh-hosts.txt
override_records_filepath=/etc/dnsserverd/config/overrides.zone
